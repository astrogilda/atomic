name: Submit reviewed Probity Atomic proposals

on:
  push:
    branches: [docs/probity-atomic-delivery-2026-10-02]

permissions:
  contents: read

concurrency:
  group: submit-probity-atomic-proposals
  cancel-in-progress: false

jobs:
  submit:
    if: github.repository == 'astrogilda/atomic'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify credential and submit fixed reviewed proposals
        env:
          ATOMIC_UPSTREAM_PAT: ${{ secrets.ATOMIC_UPSTREAM_PAT }}
        run: python3 docs/probity-delivery/submit_prs.py --execute
      - uses: actions/upload-artifact@v4
        with:
          name: atomic-upstream-prs
          path: atomic-upstream-prs.json
          if-no-files-found: error
